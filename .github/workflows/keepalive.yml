name: Maintien en éveil
# Un service gratuit Render s'endort après 15 minutes sans visite. Cette tâche le réveille toutes les 10 minutes.
# Elle ne fait rien tant que la variable de dépôt GEONEX_PUBLIC_URL (adresse du service, sans « / » final) n'est pas définie.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le service
        env:
          URL: ${{ vars.GEONEX_PUBLIC_URL }}
        run: |
          if [ -z "$URL" ]; then echo "GEONEX_PUBLIC_URL non défini : rien à faire."; exit 0; fi
          curl -fsS --max-time 100 --retry 2 "$URL/api/health" || echo "Service pas encore joignable (réveil en cours ou déploiement)."
