name: Site web (GitHub Pages)
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @geonex/shared
      - name: Export du client web
        working-directory: apps/client
        env:
          # Adresse de l'API hébergée ailleurs (variable de dépôt GEONEX_API_URL). Vide : le site s'affiche mais ne peut pas lancer de partie.
          EXPO_PUBLIC_API_URL: ${{ vars.GEONEX_API_URL }}
          GEONEX_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web
      - run: cp apps/client/dist/index.html apps/client/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/client/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
